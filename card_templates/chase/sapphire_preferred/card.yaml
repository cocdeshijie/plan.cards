notes: |
  June 15, 2026 refresh.
  Chase Travel hotel credit doubled from $50 to $100/yr.
  Added 3x on gas & EV charging and 3x on vacation home rentals.
  Standard Chase Travel redemption is 1cpp; selected Points Boost offers vary.
  Legacy points may have different redemption terms; check the booking quote.
  Global Entry/TSA PreCheck/NEXUS credit ($120, once every 4 years).
  1-year complimentary Apple TV (activate by Dec 31, 2026).
  Emergency Evacuation & Transportation coverage up to $100,000.
  Anniversary bonus ended; pre-June 15, 2026 applicants earn the final 10%
  bonus on eligible purchases through October 1, 2026, paid by January 31, 2027.
  Hyatt transfers are now 4:3 for both new and existing cardmembers.
  No foreign transaction fees.

