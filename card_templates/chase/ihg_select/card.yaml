notes: |
  Closed to new cardmembers. Historically documented annual fee is $49. Includes IHG
  Platinum Elite status and an anniversary Free Night with a 40,000-point redemption cap.
  Historical program also provides a 10% points-redemption rebate, up to 100,000 rebated
  points per calendar year; consult the account benefit terms. No foreign transaction
  fees. Historical IHG Rewards Club Select covers identify the same product.

