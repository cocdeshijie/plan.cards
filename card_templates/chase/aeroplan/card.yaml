notes: |
  Current acquisition terms; existing accounts follow their transition notice.
  Automatic Aeroplan 25K status while eligible account remains open.
  Card earns 3x Air Canada; advertised 5x includes separate airline status earnings.
  Dining/grocery purchases posting through December 31, 2026 earn 3x, then 2x.
  Air Canada credit: $50 January-June and $50 July-December on eligible direct
  purchases; excludes gift cards, third-party bookings and onboard Wi-Fi.
  FLY15OFF reduces eligible Air Canada award base-fare points by at least 15%.
  Free first checked bag for cardmember and up to eight companions on same booking.
  Global Entry/TSA PreCheck/NEXUS reimbursement up to $120 every four years.
  No foreign transaction fees.

