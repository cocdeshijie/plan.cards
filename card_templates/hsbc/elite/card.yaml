name: HSBC Elite World Elite Mastercard
issuer: HSBC
network: Mastercard
annual_fee: 495
currency: USD
version_id: hsbc_elite_2026_1

benefits:
  bonus_categories:
    - category: Travel
      multiplier: 5x
    - category: Dining
      multiplier: 2x
    - category: All Other Purchases
      multiplier: 1x
  credits:
    - key: hsbc_travel_credit
      name: HSBC Travel Credit
      amount: 400
      frequency: annual
      reset_type: calendar
    - key: rideshare_credit
      name: Rideshare Credit
      amount: 10
      frequency: monthly
      reset_type: calendar

notes: |
  The previously listed $200 Airline Fee, $100 Hotel and $189 CLEAR+ credits were
  removed in 2026: no such credits exist on this card and the evidence suggests
  they were never correct. The real benefit is a single travel credit worth up to
  $400/year, valid only on airfare, hotels and car rentals booked through
  HSBC Travel.
  Airport screening credit: up to $120 toward Global Entry, TSA PreCheck,
  TSA PreCheck by CLEAR or NEXUS once every 4.5 years. Not modelled above — the
  template schema has no multi-year frequency.
  Instacart+ (up to $140/year) and the $5 monthly Lyft App credit after 3 rides
  are Mastercard World Elite network perks, not HSBC statement credits.
  Requires HSBC Premier banking relationship — apply via authenticated logon,
  the Wealth Center, or by phone.
  Annual fee waived for authorized users.
  $0 AF with Private Banking, $295 for HSBC employees.
  No foreign transaction fees.

tags:
