name: Carnival Rewards Mastercard
issuer: Barclays
network: Mastercard
annual_fee: 0
currency: USD
version_id: barclays_carnival_2026_1

benefits:
  bonus_categories:
    - category: Eligible Carnival Purchases (Card Earnings)
      multiplier: 3x
    - category: Restaurants & Grocery Stores
      multiplier: 2x
    - category: All Other Purchases
      multiplier: 1x

notes: |
  Carnival Rewards launched September 1, 2026; former FunPoints converted.
  Card earns 3x on eligible Carnival purchases. Up to 3x additional points from
  Carnival's loyalty program can bring the combined total to 6x; not a 6x card rate.
  Earn one Status Qualifying Star per dollar of eligible card purchases, plus
  applicable Carnival loyalty-program Stars. Rewards are tied to Carnival.
  Existing account numbers remain unchanged when new designs are issued.

