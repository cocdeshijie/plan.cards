    - category: All Other Eligible Purchases
      multiplier: 1x

notes: |
  Legacy Membership Rewards co-brand, closed to acquisition while existing holders retain
  their card. Requires the applicable eligible Morgan Stanley relationship. Distinct from
  Morgan Stanley Blue Cash Preferred and Morgan Stanley Platinum. The annual fee is zero
  in the issuer 2019 agreement. Current benefit terms verify the listed earn categories.
  The historical $100 award after $25,000 anniversary spend is not pre-populated because
  it was not confirmed in current benefit terms. No exact application-closure date is
  asserted.

