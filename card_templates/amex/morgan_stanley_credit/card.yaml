name: Morgan Stanley Credit Card from American Express
issuer: Amex
network: Amex
annual_fee: 0
currency: USD
version_id: amex_morgan_stanley_credit_2026_1
status: closed_to_new_applicants

benefits:
  bonus_categories:
    - category: Airfare purchased directly from scheduled passenger airlines
      multiplier: 2x
    - category: U.S. Restaurants
      multiplier: 2x
    - category: Select U.S. Department Stores
      multiplier: 2x
    - category: Car rentals purchased directly from select rental companies
      multiplier: 2x
    - category: Eligible Amex Travel online purchases (non-stacking)
      multiplier: 2x
