  credits:
    - key: uber_cash
      name: Uber Cash
      amount: 15
      frequency: monthly
      reset_type: calendar
    - key: uber_one
      name: Uber One Membership
      amount: 120
      frequency: annual
      reset_type: calendar
    - key: digital_entertainment
      name: Eligible Digital Entertainment
      amount: 25
      frequency: monthly
      reset_type: calendar
    - key: hotel_credit
      name: Prepaid FHR / Hotel Collection
      amount: 300
      frequency: semi_annual
      reset_type: calendar
    - key: airline_fee
      name: Selected Airline Incidental Fees
      amount: 200
      frequency: annual
      reset_type: calendar
    - key: resy
      name: Eligible Resy Purchases
      amount: 100
      frequency: quarterly
      reset_type: calendar
    - key: clear_plus
      name: CLEAR+
      amount: 219
