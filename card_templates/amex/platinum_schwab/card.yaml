  bonus_categories:
    - category: Flights direct with airlines or via Amex Travel
      multiplier: 5x
      cap: 500000
    - category: Prepaid Hotels via Amex Travel
      multiplier: 5x
      portal_only: true
    - category: All Other Eligible Purchases
      multiplier: 1x
  spend_thresholds:
    - key: delta_unlimited_access
      name: Unlimited Delta Sky Club Access
      spend_required: 75000
      frequency: annual
      reset_type: calendar
      description: Eligible spending unlocks unlimited visits subject to flight and admission rules,
        through the following calendar year and January 31 thereafter.
    - key: centurion_guest_access
      name: Centurion Lounge Complimentary Guest Access
      spend_required: 75000
      frequency: annual
      reset_type: calendar
      description: Eligible spending unlocks up to two complimentary guests under applicable lounge
        rules, through the following calendar year and January 31 thereafter.

notes: |
  Requires an eligible Schwab account. Enrollment and merchant restrictions apply to
  relevant credits; credits are shared across the account. Uber Cash adds $20 in December
  to the monthly $15. Walmart+ reimburses the eligible $12.95 monthly membership plus tax;
  kept in notes because amounts in this schema are whole dollars. Global Entry (up to
  $120) or TSA PreCheck (up to $85) is once per four years, not annually. Hotel Collection
  bookings require two nights. Schwab Appreciation Bonus depends on qualifying holdings:
  $100 from $250,000, $200 from $1 million, or $1,000 from $10 million. It is not an
  unconditional credit. Membership Rewards can be deposited to an eligible Schwab account;
  check current redemption terms. Lounge access and hotel-status enrollment have separate
  terms. Saks credit is not included in the current application terms reviewed.

