benefits:
  bonus_categories:
    - category: Kroger Pay (non-fuel)
      multiplier: 5x
      cap: 3000
    - category: Mobile Wallet (Apple Pay, Google Wallet, Samsung Pay, Garmin Pay)
      multiplier: 5x
      cap: 3000
    - category: Kroger Family of Companies (excludes Fuel Centers)
