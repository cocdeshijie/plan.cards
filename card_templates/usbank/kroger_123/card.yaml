notes: |
  Legacy U.S. Bank Kroger-family program; retained for historical tracking.
  U.S. Bank announces conversion to Smartly expected to finish in fall 2026;
  follow the individual account notice. The new First Bank & Trust/Imprint
  Kroger card requires a separate application and is a separate catalog product.
  Renamed from "Kroger 1-2-3 Rewards Visa". The card is a MASTERCARD (World Elite);
  the template previously recorded Visa, which appears never to have been correct.
  The 5x rates drop to 2x (Kroger Pay) and 1x (other mobile wallets) after $3,000
  of spend in each category per calendar year.
  Fuel Center purchases earn NOTHING — the previous "Grocery + Fuel 3x" was backwards.
  Redemption: 1,000 points = $10 statement credit (NOT $1), or 2,500 points = $25
  Kroger gift card. Real-Time Rewards on Kroger purchases of $10+. Points expire
  after 36 months.
  No foreign transaction fee — the previously recorded 3% was wrong.
  New-cardmember offers are one-time, not recurring: $100 statement credit after
  $500 in 90 days, plus a Boost Essential membership at approval.
  Verified against U.S. Bank application terms self-dated 08/2026.

