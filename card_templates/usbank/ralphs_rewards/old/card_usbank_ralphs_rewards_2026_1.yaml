notes: |
  Ralphs-branded Kroger family credit card. Mobile wallet purchases share a $3,000 annual
  5% spending limit, then earn 1%. Eligible non-fuel Kroger Pay purchases have a separate
  $3,000 calendar-year 5% limit, then earn 2%; Kroger Pay fuel-center transactions do not
  earn rewards. Dining and fuel share a $6,000 annual 3% spending limit, then earn 1%. No
  foreign transaction fee. Rewards depend on eligible transaction and merchant coding.

