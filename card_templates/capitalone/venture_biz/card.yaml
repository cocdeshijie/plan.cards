# Reviewed 2026-09-09. Sources:
# https://www.capitalone.com/small-business/credit-cards/venture-business/
name: Capital One Venture Business Card
issuer: Capital One
network: Mastercard
annual_fee: 95
currency: USD
version_id: capitalone_venture_biz_2026_2

benefits:
  credits:
    - key: capital_one_travel_credit
      name: Capital One Travel Credit
      amount: 50
      frequency: annual
      reset_type: cardiversary
    - key: advertising_software_credit
      name: Advertising & Software Credit
      amount: 50
      frequency: annual
      reset_type: cardiversary
  bonus_categories:
    - category: Hotels, Rental Cars & Vacation Rentals (Capital One Business Travel)
      multiplier: 5x
      portal_only: true
    - category: All Other Purchases
      multiplier: 2x

notes: |
  Travel credit applies through Capital One Business Travel; advertising/software
  credit requires a qualifying merchant category. Both expire at account anniversary.
  Global Entry or TSA PreCheck application credit up to $120 every four years.
  Miles transfer to travel partners. No foreign transaction fees.

tags:
