notes: |
  April 2026 revamp. The bill credit is now a flat $20 statement credit in every
  billing cycle you spend $1,000, replacing the old tiered
  "$20 after $1,000 / $10 after $500" structure. The paperless-billing
  requirement was dropped.
  Additionally $10/month per AT&T phone line and $10/month for internet — these
  are AT&T service discounts rather than card statement credits, so they are not
  modelled above.
  ThankYou points.
  3% foreign transaction fee.

