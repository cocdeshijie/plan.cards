# Reviewed 2026-09-09. Sources:
# https://www.citi.com/credit-cards/citi-aadvantage-executive-world-legend-mastercard
name: Citi / AAdvantage Executive World Legend Mastercard
issuer: Citi
network: Mastercard
annual_fee: 695
currency: USD
version_id: citi_aadvantage_executive_2026_2

benefits:
  credits:
    - key: aa_vacations_credit
      name: AA Vacations Credit
      amount: 250
      frequency: semi_annual
      reset_type: calendar
    - key: lyft_credit
      name: Lyft Credit
      amount: 15
      frequency: monthly
      reset_type: calendar
    - key: avis_budget_credit
      name: Avis / Budget Credit
      amount: 120
      frequency: annual
      reset_type: calendar
    - key: inflight_admirals_credit
      name: Inflight & Admirals Club Credit
      amount: 100
      frequency: annual
      reset_type: calendar
  spend_thresholds:
    - name: Enhanced AA Earning Rate
      spend_required: 150000
      frequency: annual
      reset_type: calendar
      description: "Earn 5x miles on American Airlines purchases after $150,000 total spend in a calendar year."
  bonus_categories:
    - category: American Airlines Purchases
      multiplier: 4x
    - category: Eligible AAdvantage Hotels & AAdvantage Cars Bookings
      multiplier: 12x
      portal_only: true
    - category: All Other Purchases
      multiplier: 1x

notes: |
  Current World Legend offer. Existing accounts follow their renewal notices.
  Admirals Club membership; first checked bag free for the primary cardholder
  and up to eight companions on the same domestic American Airlines itinerary.
  Lyft credit requires three eligible rides in a calendar month.
  Avis/Budget credit requires eligible prepaid rentals booked directly.
  AA Vacations credit is limited to $250 each calendar half-year.
  Grubhub is not a benefit of the current new-card offer; legacy eligibility
  must be checked against the individual account notice.
  Omni Hotels Champion status requires enrollment.
  Global Entry/TSA PreCheck credit up to $120 every four years.
  No foreign transaction fees.

tags:
  - airline
  - american-airlines
