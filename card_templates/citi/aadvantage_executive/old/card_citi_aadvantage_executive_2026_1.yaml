notes: |
  August 23, 2026 refresh. Annual fee increased $595 -> $695 and the card moved
  from the World Elite to the World Legend Mastercard tier. Existing cardholders
  get the new benefits immediately and the higher fee at their next anniversary;
  they can stay on old/card_citi_aadvantage_executive_2020_1.yaml until then.
  The Avis/Budget, Lyft and Grubhub credits are not new — they predate the
  refresh and were simply missing from this template.
  Admirals Club membership included.
  Checked bag free for cardholder + up to 8 companions on same reservation.
  Preferred boarding.
  Concierge service.
  No foreign transaction fee.

