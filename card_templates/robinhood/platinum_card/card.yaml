# Reviewed 2026-09-09. Sources:
# https://api.robinhood.com/creditcard/legal/platinum-benefits-overview
# https://api.robinhood.com/creditcard/legal/platinum-reward-terms
# https://robinhood.com/us/en/support/articles/platinum-travel/
