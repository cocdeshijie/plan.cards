name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a run be started by hand from the Actions tab or `gh workflow run ci.yaml`,
  # without pushing a throwaway commit just to re-trigger the checks.
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -v
        env:
          DATABASE_URL: "sqlite:///test.db"
          CARD_TEMPLATES_DIR: "../card_templates"
          # Without this, slowapi throttles the setup/login fixtures and the
          # suite drowns in 429s. Documented in README.md and CLAUDE.md.
          RATE_LIMIT_ENABLED: "false"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Track the same major the Dockerfile uses (oven/bun:1-alpine) so CI
          # validates the dependency tree the image actually builds.
          bun-version: "1"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
