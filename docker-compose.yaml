services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose:
      - "8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      - DATABASE_URL=sqlite:////data/cards.db
      - CARD_TEMPLATES_DIR=/card_templates
    volumes:
      - db-data:/data
      - ./card_templates:/card_templates:ro
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    # No `ports` here on purpose: platform deployments (Coolify et al.) route to
    # the container through their own proxy, and binding a fixed host port
    # collides across apps. Standalone hosting gets the published port from
    # docker-compose.override.yml, which a bare `docker compose up -d` merges in
    # automatically.
    expose:
      - "3000"
    depends_on:
      backend:
        # Wait for the API to pass its healthcheck, not merely to start. On a
        # first boot the backend runs migrations and parses ~400 template
        # directories before it accepts connections, and the setup wizard's
        # calls would 502 through the Next.js rewrite during that window.
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
